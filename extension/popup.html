<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoodBox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <main class="popup-panel">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="logo.png" alt="MoodBox" class="brand-logo">
        <span class="brand-title">MoodBox</span>
        <small id="connectionText" class="connection-label">Connecting…</small>
      </div>
      <span id="statusDot" class="status-dot" aria-hidden="true" title="Status"></span>
    </header>

    <!-- Quick Actions -->
    <div class="popup-actions">
      <button id="batchDownload" class="action-btn" type="button">
        <img src="logo.png" alt="" class="action-icon">
        <div class="action-meta">
          <strong>Batch Download</strong>
          <small>Scan and grab page images</small>
        </div>
      </button>

      <button id="openLibrary" class="action-btn" type="button">
        <img src="logo.png" alt="" class="action-icon">
        <div class="action-meta">
          <strong>MoodBox Library</strong>
          <small>Asset manager &amp; boards</small>
        </div>
      </button>
    </div>

    <!-- Status Footer -->
    <footer class="popup-footer">
      <small id="moodboxProjectStatus" class="footer-status">Connecting to MoodBox app…</small>
    </footer>

    <p id="message" class="message" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
