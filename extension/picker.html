<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send to MoodBox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="picker-body">
  <main class="note-picker-shell">
    <header class="note-picker-header">
      <div class="picker-brand">
        <img id="capturePreview" class="capture-preview" alt="Selected reference">
        <div class="picker-heading">
          <h1>Send to MoodBox</h1>
          <p id="targetProject" class="target-project" aria-live="polite">Connecting…</p>
        </div>
      </div>
      <button id="cancelTop" class="icon-close" type="button" aria-label="Close">×</button>
    </header>

    <div id="targetChooser" class="target-chooser" hidden>
      <select id="targetSelect" aria-label="Choose MoodBox"></select>
    </div>

    <section class="note-editor-card">
      <label for="noteEditor">Note <span>Optional</span></label>
      <div class="mention-editor-wrap">
        <textarea id="noteEditor" spellcheck="true" autofocus placeholder="Write a note, observation, idea, or reminder…"></textarea>
        <div id="mentionPanel" class="mention-panel" hidden>
          <div id="mentionStatus" class="mention-status">Suggestions</div>
          <div id="mentionList" class="mention-list" role="listbox"></div>
        </div>
      </div>
    </section>

    <p id="message" class="message picker-message" aria-live="polite"></p>
    <footer class="picker-actions">
      <span class="shortcut-hint">Ctrl + Enter to send</span>
      <button id="cancel" class="secondary" type="button">Cancel</button>
      <button id="send" class="primary" type="button">Send</button>
    </footer>
  </main>
  <script src="picker.js"></script>
</body>
</html>
